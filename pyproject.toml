[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maixrag"
version = "0.1.0"
description = "MaixCAM 开发助手 —— RAG 与 Agent 教学项目"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# 刻意保持精简。每一个依赖都要能对读者解释清楚为什么需要它，
# 以及它替代了什么手写代码（见 docs/design/01 第 1.3 节：不用编排框架）。
dependencies = [
    "numpy>=1.24",          # 向量检索：归一化矩阵内积，语料小到不需要 ANN 库
    "PyYAML>=6.0",          # 配置与语料清单
    "markdown-it-py>=3.0",  # Markdown AST 解析（比正则健壮得多）
    "jieba>=0.42",          # 中文分词；BM25 的基础
]

[project.optional-dependencies]
# 开发与测试。pytest 是必需的教学工具：没有测试就无法做回归门禁。
dev = ["pytest>=8.0"]

[project.scripts]
maixrag = "maixrag.cli:main"

[tool.setuptools]
packages = ["maixrag", "maixrag.agent", "maixrag.corpus", "maixrag.indexing", "maixrag.evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
